[package]
name = "hotcode_proc_macro"
version = "0.1.3"
edition = "2024"
rust-version = "1.89.0"
description = "Procedural macros for hotcode library."
license = "MIT"
repository = "https://github.com/alordash/hotcode"
readme = "../../README.md"

[lib]
proc-macro = true

[dependencies]
quote = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
not_enough_syntax = { workspace = true }
hotcode_core = { workspace = true }

[lints.clippy]
needless_return = "allow"
match_like_matches_macro = "allow"
